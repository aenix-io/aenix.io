# Pages that may exist in one language only.
#
# Read by scripts/check-content-rules.py (rule: locale-parity). Every English
# page or blog post needs a German counterpart (`hreflang_de` here,
# `hreflang_en` back on the German page) unless an entry below matches it.
# The same applies to German pages without an English original.
#
# Each entry has ONE matcher and a reason:
#   path:      glob on the repo-relative file path ("dir/**" matches everything below dir)
#   page_type: the page's page_type (front matter, or the /for/ cascade)
#   robots:    substring of the page's `robots:` front matter
#   reason:    why this page has no counterpart (required)
#
# Do not add new pages here to skip translation: new pages ship EN + DE in the
# same PR. When you translate a "legacy" page, delete its entry: the checker
# fails on exact-path entries whose file is gone or that now has a counterpart.

# --- Kinds of pages that are single-language by design ---------------------

- page_type: flag-page
  reason: "Redirect, flag, thank-you and synced calculator pages; not standalone content."
- page_type: error-page
  reason: "Error page."
- robots: noindex
  reason: "Not indexed, so it has no search counterpart to pair with."

- path: "content/tour-2026/**"
  reason: "Event page; German event pages were deliberately removed."
- path: "content/workshops/**"
  reason: "Event pages; German event pages were deliberately removed."
- path: "content/workshop/**"
  reason: "Workshop lab environment for event attendees."
- path: "content/webinars/**"
  reason: "Event pages; German event pages were deliberately removed."
- path: "content/web0826/**"
  reason: "Webinar materials page for attendees (event)."
- path: "content/certification/**"
  reason: "Certification section is paired EN <-> RU (hreflang_ru), not German."
- path: "content/ru/**"
  reason: "Russian locale; not part of the EN <-> DE pairing."
- path: "content/fr/**"
  reason: "French locale (event pages); not part of the EN <-> DE pairing."
- path: "content/styleguide/**"
  reason: "Developer page, not built in production."
- path: "content/l/**"
  reason: "Short-link redirect namespace, never rendered."
- path: "content/go/**"
  reason: "Link registry tool for the team."
- path: "content/demo/**"
  reason: "Demo app shell."
- path: "content/idp/**"
  reason: "IDP demo app shell."
- path: "content/quiz/**"
  reason: "Preserved standalone quiz (CLAUDE.md, Preserved pages)."
- path: "content/oss-contribution.md"
  reason: "Preserved page maintained by hand (CLAUDE.md, Preserved pages)."

# --- German-only pages -------------------------------------------------------

- path: "content/de/impressum/_index.md"
  reason: "German legal notice (Impressum), required for the German site only."
- path: "content/de/blog/2026/05/cloud-migration-strategie/index.md"
  reason: "Written for the DACH audience in German; there is no English original."

