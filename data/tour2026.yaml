# Timur Tukaev — Cozystack Tour 2026 travel schedule, rendered on /tour-2026/
# by the `tour-schedule` shortcode.
#
# To add a university talk, community meetup or podcast recording, append an
# item to the stop's `events` list. Kinds: conference, workshop, talk,
# community, podcast, private. Status: confirmed | planned — use `planned`
# until the date AND the venue are fixed.
#
# Booking links live under `calendars`; replace the URLs once the zcal
# scheduling links exist.
#
# The German tour and workshop pages are withdrawn (their URLs redirect to
# English), so the `_de` fields are currently unused. If German pages return,
# they read the `<field>_de` sibling of a field when
# it exists and fall back to the English value otherwise (addresses and
# conference names need no `_de`). When you add or change an English value,
# add or update its `_de` sibling too. `book_de` is the German label of a
# calendar's booking link (English builds "Book a slot in <name>").

calendars:
  - key: europe
    name: "Europe"
    name_de: "Europa"
    window: "18 October – 7 November 2026"
    window_de: "18. Oktober – 7. November 2026"
    zones: "Paris, Berlin, Warsaw, Copenhagen, Amsterdam, Milan, Madrid, London"
    zones_de: "Paris, Berlin, Warschau, Kopenhagen, Amsterdam, Mailand, Madrid, London"
    url: "https://zcal.co/timurtukaev/europe-2026"
    book_de: "Termin in Europa buchen"
  - key: usa
    name: "United States"
    name_de: "USA"
    window: "7 November – 11 December 2026"
    window_de: "7. November – 11. Dezember 2026"
    zones: "Salt Lake City, San Francisco, Seattle, Austin, Dallas, Washington DC, Boston, New York"
    url: "https://zcal.co/timurtukaev/usa-2026"
    book_de: "Termin in den USA buchen"

