# Customer testimonials for the rotating quote carousel ({{< quote-carousel >}}).
# Add ONE entry here and it appears in the carousel on every page that uses it.
# Order matters: the carousel always leads with the first entry below.
# Tier-1 named quotes require Timur sign-off (CLAUDE.md Rule 1). EN is required;
# quote_de / role_de are optional German overrides (fall back to EN on DE pages).
# photo is optional — without it the avatar shows the person's initials.
- name: "Alexandru Popescu"
  role: "CEO, Nuvolos"
  photo: "/images/quotes/alexandru-popescu.png"
  quote: >-
    Running Nuvolos on sovereign bare metal meant we needed hyperscaler-grade
    multi-tenancy without the hyperscaler. Cozystack delivered exactly that —
    isolated tenants, shared GPUs, KubeVirt for legacy workloads — and it's why
    we can promise our customers infrastructure control, not just a workspace.

- name: "Matthieu Robin"
  role: "Hidora — Hikube, Swiss sovereign cloud"
  role_de: "Hidora — Hikube, souveräne Schweizer Cloud"
  photo: "/images/quotes/matthieu-robin.jpg"
  quote: >-
    Aenix has been a true partner in building Hikube, our Swiss sovereign
    cloud. Their technology is rock-solid, but what really sets them apart is
    how closely they listen and the quality of their support, always
    responsive, always invested in our success. As Hikube has grown, Aenix has
    grown with us. It's a partnership in the fullest sense.

- name: "Qasym Majen"
  role: "Founder, QOSI — Qazaq Open Source Initiative"
  role_de: "Gründer, QOSI — Qazaq Open Source Initiative"
  photo: "/images/quotes/qasym-majen.png"
  quote: >-
    Cozystack has the energy of a young project and the strength of a mature
    platform — a rare and rather dangerous combination for the old guard.
    Ænix maintains it with the mindset of a hungry startup: they listen,
    move fast, and solve customer problems instead of sending them into a
    support maze.
  quote_de: >-
    Cozystack hat die Energie eines jungen Projekts und die Stärke einer
    ausgereiften Plattform — eine seltene und für die alte Garde durchaus
    gefährliche Kombination. Ænix pflegt es mit der Denkweise eines hungrigen
    Startups: Sie hören zu, handeln schnell und lösen Kundenprobleme, anstatt
    sie in ein Support-Labyrinth zu schicken.

- name: "Evgeniy Kozhukhovskiy"
  role: "CEO & Founder, Kubeone"
  photo: "/images/quotes/evgeniy-kozhukhovskiy.jpg"
  quote: >-
    Cozystack is a powerful platform, but Ænix is what lets us squeeze every
    last bit of value out of it. Their team knows the product down to the
    source code, responds within minutes rather than days, and treats our
    roadmap as if it were their own. With Ænix behind us, we ship new managed
    services faster and sleep better — the platform just keeps running.

- name: "Sergey Fedenyak"
  role: "CEO & Founder, Gohost"
  quote: >-
    Working with Ænix feels less like buying support and more like gaining an
    engineering partner. They bring serious product and platform expertise to
    every conversation, flag risks before they become incidents, and help us
    turn Cozystack into real business results: shorter time-to-market,
    predictable operations, and infrastructure costs we can finally plan around.

- name: "Tamerlan Abu"
  role: "Founder, QOSI — Qazaq Open Source Initiative"
  role_de: "Gründer, QOSI — Qazaq Open Source Initiative"
  photo: "/images/quotes/tamerlan.jpg"
  quote: >-
    Cozystack helps us stay agile and spread opensource as far as we can reach.
