# Ænix support tiers — single source of truth for the pricing table.
#
# Rendered server-side by layouts/shortcodes/pricing-table.html so the prices and
# the SLA matrix are in the HTML for Google, AI search engines and no-JS clients.
# /js/pricing-table.js only switches the displayed price between the annual and
# monthly figures already present in the markup — it no longer owns any data.
#
# This is the Ænix Public Cloud Platform subscription; every tier includes the
# commercial modules. A team running Cozystack itself buys the same subscription
# and may leave the modules unused. Private Cloud Platform and AI Platform are
# quoted per RFP and are not priced from this table.
#
# Annual billing = 10 months of the monthly price ("2 months free"):
# price_annual * 12 == price_monthly * 10. Keep that true if you change a price.
#
# Feature rows describe SUPPORT SCOPE, not software entitlement. White-labeling,
# air-gapped installs, GPU sharing (HAMi) and backups are open-source Cozystack
# features available to everyone; the tier decides whether Ænix supports them.
# Only the "Ænix commercial modules" rows are proprietary Ænix software.

# Toggle label and the unit printed next to every price.
annual_label: "2 months free"
price_unit: "/ month per 10 nodes"

plans:
  - id: basic
    name: Basic
    price_annual: 1250
    price_monthly: 1500
    who: "Small providers, startups, and internal teams running limited workloads"
    value: "Business-hours incident support, the Ænix commercial modules, CVE fixes and knowledge-base upgrade guidance. Low risk at low cost"
  - id: standard
    name: Standard
    price_annual: 3000
    price_monthly: 3600
    who: "Middle-size providers and data centers, growing teams with production SLAs who need faster responses and hands-on guidance"
    value: "Unlimited incidents, 4-hour emergency response, platform installation, supervised upgrades and fast-track security fixes"
  - id: plus
    name: Plus
    price_annual: 5500
    price_monthly: 6600
    who: "Regulated and privacy-conscious organizations, SPs/DCs with mission-critical clusters"
    value: "24×7 support, 8-hour standard response, air-gapped install support, guided migration, compliance audit support and external monitoring"
  - id: enterprise
    name: Enterprise
    price_annual: null
    price_monthly: null
    contact_url: "/contact/"
    who: "Large-scale platforms and partners needing roadmap influence and custom integrations"
    value: "Co-engineering on features, architectural reviews, and tailored SLAs across multi-DC and air-gapped setups"

sections:
  - title: Information
    long: true
    items:
      - k: "Who is it for"
        from: who
      - k: "Value"
        from: value

  - title: SLA-guaranteed Support
    items:
      - k: "Package Includes"
        v: { basic: "10 Physical Nodes", standard: "10 Physical Nodes", plus: "10 Physical Nodes", enterprise: "Custom" }
      - k: "Incidents covered¹"
        v: { basic: "5", standard: "Unlimited", plus: "Unlimited", enterprise: "Unlimited" }
      - k: "Service Desk Hours²"
        v: { basic: "Business Hours", standard: "Business Hours", plus: "24×7 Support", enterprise: "24×7 Support" }
      - k: "Emergency Response Time³"
        v: { basic: "In 8 Hours", standard: "In 4 Hours", plus: "In 4 Hours", enterprise: "In 1 Hour" }
      - k: "Standard Response Time"
        v: { basic: "In 2 Business Days", standard: "In 2 Business Days", plus: "In 8 Hours", enterprise: "In 4 Hours" }

  - title: Ænix commercial modules (proprietary)
    items:
      - k: "Billing System"
        v: { basic: "✔", standard: "✔", plus: "✔", enterprise: "✔" }
      - k: "WHMCS Integration"
        v: { basic: "✔", standard: "✔", plus: "✔", enterprise: "✔" }

  - title: Support scope for open-source Cozystack features
    items:
      - k: "White-labeling configuration"
        v: { basic: "✖", standard: "✔", plus: "✔", enterprise: "✔" }
      - k: "Air-gapped installation"
        v: { basic: "✖", standard: "✖", plus: "✔", enterprise: "✔" }
      - k: "Backup configuration"
        v: { basic: "✔", standard: "✔", plus: "✔", enterprise: "✔" }
      - k: "GPU sharing (HAMi) configuration"
        v: { basic: "✖", standard: "✔", plus: "✔", enterprise: "✔" }

  - title: PoC
    items:
      - k: "PoC Support Level"
        v: { basic: "Knowledge base and answering questions", standard: "Basic PoC", plus: "Full PoC Package", enterprise: "Full PoC Package" }

  - title: Learning and trainings
    items:
      - k: "K8s Deep Dive Course"
        v: { basic: "Quoted on request", standard: "Quoted on request", plus: "1 full course/year free; additional at 30% off", enterprise: "1 full course/year free; additional at 30% off" }
      - k: "Training"
        v: { basic: "1 hour/month", standard: "2 hours/month", plus: "3 hours/month", enterprise: "5 hours/month" }

  - title: Security Features
    items:
      - k: "Fast-track security bug fixing"
        v: { basic: "✖", standard: "✔", plus: "✔", enterprise: "✔" }
      - k: "CVE Vulnerabilities"
        v: { basic: "✔", standard: "✔", plus: "✔", enterprise: "✔" }
      - k: "User Authentication Support"
        v: { basic: "✔", standard: "✔", plus: "✔", enterprise: "✔" }

  - title: Consulting/Managed Assistance
    items:
      - k: "Migration"
        v: { basic: "Documentation only", standard: "Documentation only", plus: "Guided by Ænix", enterprise: "Managed by Ænix" }
      - k: "Architecture Advisory"
        v: { basic: "Billed hourly", standard: "Billed hourly", plus: "✔", enterprise: "✔" }
      - k: "Best-Practice Audit"
        v: { basic: "Billed hourly", standard: "Billed hourly", plus: "✔", enterprise: "✔" }
      - k: "Platform Installation"
        v: { basic: "✖", standard: "✔", plus: "✔", enterprise: "✔" }
      - k: "Compliance audit support"
        v: { basic: "✖", standard: "✖", plus: "✔", enterprise: "✔" }
      - k: "Supervised Upgrade Assistance"
        v: { basic: "✖", standard: "✔", plus: "✔", enterprise: "✔" }
      - k: "Out-of-scope work rate"
        v: { basic: "$150 / hour", standard: "$150 / hour", plus: "$150 / hour", enterprise: "$150 / hour" }

  - title: Procurement
    items:
      - k: "MSA and SLA terms"
        v: { basic: "Standard, no amendments", standard: "Standard, no amendments", plus: "Standard, amendable", enterprise: "Customer templates permitted" }

  - title: Ænix Team Engagement
    items:
      - k: "Dedicated support channel"
        v: { basic: "✔", standard: "✔", plus: "✔", enterprise: "✔" }
      - k: "Remote access to your clusters, with your approval"
        v: { basic: "✖", standard: "✔", plus: "✔", enterprise: "✔" }
      - k: "External Monitoring"
        v: { basic: "✖", standard: "✖", plus: "✔", enterprise: "✔" }
      - k: "Personalized Roadmap"
        v: { basic: "✖", standard: "✖", plus: "✔", enterprise: "✔" }
      - k: "Priority Engagement Time⁴"
        v: { basic: "2 Hours", standard: "4 Hours", plus: "15 Hours", enterprise: "40 Hours" }

# Footnotes printed under the table (the ¹–⁴ marks in the row labels).
notes:
  - "¹ Basic covers five incidents; the period is set in the support contract. Incidents raised within the 30-day installation-support period do not count."
  - "² Business hours: Monday to Friday, 9:00–18:00 CET, excluding holidays."
  - "³ Emergency: a production system down or unresponsive with no workaround."
  - "⁴ Engineering time per month for your requests: features, integrations or reviews."
  - "Feature rows describe what Ænix supports; the features themselves are open-source Cozystack. Prices in USD; contracts with AENIX s.r.o. are in EUR."

