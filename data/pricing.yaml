# Ænix support tiers — single source of truth for the pricing table.
#
# Rendered server-side by layouts/shortcodes/pricing-table.html so the prices and
# the SLA matrix are in the HTML for Google, AI search engines and no-JS clients.
# /js/pricing-table.js only switches the displayed price between the annual and
# monthly figures already present in the markup — it no longer owns any data.
#
# This is the Ænix Public Cloud Platform subscription; every tier includes the
# commercial modules. A team running Cozystack itself buys the same subscription
# and may leave the modules unused. Private Cloud Platform and AI Platform are
# quoted per RFP and are not priced from this table.
#
# Annual billing = 10 months of the monthly price:
# price_annual * 12 == price_monthly * 10. Keep that true if you change a price.
#
# Feature rows describe SUPPORT SCOPE, not software entitlement. White-labeling,
# air-gapped installs, GPU sharing (HAMi) and backups are open-source Cozystack
# features available to everyone; the tier decides whether Ænix supports them.
# Only the "Ænix commercial modules" rows are proprietary Ænix software.


# Tier cards (above the comparison): `label` is the line above the tier name,
# `short` the one-line "who it is for", `points` the three things that set the
# tier apart. `who` and `value` are the long versions, shown in the full table.
plans:
  - id: basic
    name: Basic
    price_annual: 1250
    price_monthly: 1500
    label: "Business hours"
    short: "Small providers and internal teams"
    points: ["8-hour emergency response", "5 covered incidents¹", "CVE fixes and upgrade guidance"]
    who: "Small providers, startups, and internal teams running limited workloads"
    value: "Business-hours incident support, the Ænix commercial modules, CVE fixes and knowledge-base upgrade guidance. Low risk at low cost"
  - id: standard
    name: Standard
    price_annual: 3000
    price_monthly: 3600
    label: "Production support"
    short: "Growing providers with production SLAs"
    points: ["4-hour emergency response", "Unlimited incidents", "Installation and supervised upgrades"]
    who: "Middle-size providers and data centers, growing teams with production SLAs who need faster responses and hands-on guidance"
    value: "Unlimited incidents, 4-hour emergency response, platform installation, supervised upgrades and fast-track security fixes"
  - id: plus
    name: Plus
    price_annual: 5500
    price_monthly: 6600
    label: "24×7 support"
    short: "Regulated and privacy-conscious organizations"
    points: ["4-hour emergency response", "Guided migration", "Air-gapped installation support"]
    who: "Regulated and privacy-conscious organizations, SPs/DCs with mission-critical clusters"
    value: "24×7 support, 8-hour standard response, air-gapped install support, guided migration, compliance audit support and external monitoring"
  - id: enterprise
    name: Enterprise
    price_annual: null
    price_monthly: null
    contact_url: "/contact/"
    label: "Custom agreement"
    short: "Large platforms and partners"
    points: ["1-hour emergency response", "Managed migration", "Co-engineering and tailored terms"]
    who: "Large-scale platforms and partners needing roadmap influence and custom integrations"
    value: "Co-engineering on features, architectural reviews, and tailored SLAs across multi-DC and air-gapped setups"

# Plain wording: a value says what the buyer gets ("8 hours", "Included"),
# not how a contract phrases it. ✔ renders as "Included", ✖ as a dash.
sections:
  - title: Information
    long: true
    items:
      - k: "Who is it for"
        from: who
      - k: "Value"
        from: value

  - title: SLA-guaranteed support
    items:
      - k: "Package includes"
        v: { basic: "10 physical nodes", standard: "10 physical nodes", plus: "10 physical nodes", enterprise: "Custom" }
      - k: "Coverage"
        key: true
        v: { basic: "Business hours", standard: "Business hours", plus: "24×7", enterprise: "24×7" }
      - k: "Emergency response"
        key: true
        v: { basic: "8 hours", standard: "4 hours", plus: "4 hours", enterprise: "1 hour" }
      - k: "Standard response"
        key: true
        v: { basic: "2 business days", standard: "2 business days", plus: "8 hours", enterprise: "4 hours" }
      - k: "Covered incidents"
        key: true
        v: { basic: "5¹", standard: "Unlimited", plus: "Unlimited", enterprise: "Unlimited" }

  - title: Ænix commercial modules (proprietary)
    items:
      - k: "Billing system"
        v: { basic: "✔", standard: "✔", plus: "✔", enterprise: "✔" }
      - k: "WHMCS integration"
        v: { basic: "✔", standard: "✔", plus: "✔", enterprise: "✔" }

  - title: Support scope for open-source Cozystack features
    items:
      - k: "White-labeling configuration"
        v: { basic: "✖", standard: "✔", plus: "✔", enterprise: "✔" }
      - k: "Air-gapped installation"
        key: true
        v: { basic: "✖", standard: "✖", plus: "✔", enterprise: "✔" }
      - k: "Backup configuration"
        v: { basic: "✔", standard: "✔", plus: "✔", enterprise: "✔" }
      - k: "GPU sharing (HAMi) configuration"
        v: { basic: "✖", standard: "✔", plus: "✔", enterprise: "✔" }

  - title: PoC
    items:
      - k: "PoC support"
        v: { basic: "Knowledge base and Q&A", standard: "Basic PoC", plus: "Full PoC package", enterprise: "Full PoC package" }

  - title: Learning and training
    items:
      - k: "Kubernetes deep-dive course"
        v: { basic: "Quoted on request", standard: "Quoted on request", plus: "1 full course a year free, more at 30% off", enterprise: "1 full course a year free, more at 30% off" }
      - k: "Training"
        v: { basic: "1 hour a month", standard: "2 hours a month", plus: "3 hours a month", enterprise: "5 hours a month" }

  - title: Security
    items:
      - k: "Fast-track security fixes"
        v: { basic: "✖", standard: "✔", plus: "✔", enterprise: "✔" }
      - k: "CVE fixes"
        v: { basic: "✔", standard: "✔", plus: "✔", enterprise: "✔" }
      - k: "User authentication support"
        v: { basic: "✔", standard: "✔", plus: "✔", enterprise: "✔" }

  - title: Consulting and managed assistance
    items:
      - k: "Platform installation"
        key: true
        v: { basic: "✖", standard: "✔", plus: "✔", enterprise: "✔" }
      - k: "Migration support"
        key: true
        v: { basic: "Documentation", standard: "Documentation", plus: "Guided", enterprise: "Managed" }
      - k: "Architecture advisory"
        v: { basic: "Billed hourly", standard: "Billed hourly", plus: "✔", enterprise: "✔" }
      - k: "Best-practice audit"
        v: { basic: "Billed hourly", standard: "Billed hourly", plus: "✔", enterprise: "✔" }
      - k: "Compliance audit support"
        v: { basic: "✖", standard: "✖", plus: "✔", enterprise: "✔" }
      - k: "Supervised upgrades"
        v: { basic: "✖", standard: "✔", plus: "✔", enterprise: "✔" }
      - k: "Out-of-scope work rate"
        v: { basic: "$150 / hour", standard: "$150 / hour", plus: "$150 / hour", enterprise: "$150 / hour" }

  - title: Procurement
    items:
      - k: "MSA and SLA terms"
        v: { basic: "Standard, no amendments", standard: "Standard, no amendments", plus: "Standard, amendable", enterprise: "Customer templates permitted" }

  - title: Ænix team engagement
    items:
      - k: "Dedicated support channel"
        v: { basic: "✔", standard: "✔", plus: "✔", enterprise: "✔" }
      - k: "Remote access to your clusters, with your approval"
        v: { basic: "✖", standard: "✔", plus: "✔", enterprise: "✔" }
      - k: "External monitoring"
        v: { basic: "✖", standard: "✖", plus: "✔", enterprise: "✔" }
      - k: "Personalized roadmap"
        v: { basic: "✖", standard: "✖", plus: "✔", enterprise: "✔" }
      - k: "Priority engineering per month"
        key: true
        v: { basic: "2 hours", standard: "4 hours", plus: "15 hours", enterprise: "40 hours" }

# Rows marked `key: true` form the short comparison shown by default on
# /pricing/; the button under the table expands it to every row. Without JS
# every row is shown.

# Footnotes printed under the table (the ¹ mark sits on the Basic incident count).
notes:
  - "¹ Basic covers five incidents for the period set in the support contract. Incidents raised within the 30-day installation-support period do not count."
  - "Business hours: Monday to Friday, 9:00–18:00 CET, excluding holidays. Emergency response applies when a production system is down or unresponsive with no workaround."
  - "Priority engineering is time per month for your requests: features, integrations or reviews."
  - "Feature rows describe what Ænix supports; the features themselves are open-source Cozystack."

# Customer logos under the tier cards. Rule 1: these four are among the seven
# hosting customers cleared on 2026-07-09 as Public Cloud Platform customers
# (see layouts/shortcodes/clients.html), so the line beside the logos must keep
# saying Public Cloud Platform. This placement still needs Timur's sign-off.
# The assets are light on transparent: no white plate behind them.
proof:
  title: "Running in production"
  text: "Hosting providers on Ænix Public Cloud Platform"
  logos:
    - { name: "GoHost.kz", url: "https://gohost.kz/", logo: "/images/clients/gohost.svg" }
    - { name: "HDReady", url: "https://hdready.com/", logo: "/images/clients/hdready.svg" }
    - { name: "Beby Cloud", url: "https://beby.cloud/en/", logo: "/images/clients/beby.svg" }
    - { name: "HiKube", url: "https://hikube.cloud/", logo: "/images/clients/hikube.svg" }

