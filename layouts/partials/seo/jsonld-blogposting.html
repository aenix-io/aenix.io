{{/* JSON-LD BlogPosting — blog articles */}}
{{- $author := .Params.author | default "Timur Tukaev" -}}
{{- $section := .Params.articleSection | default "Blog" -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ .Title }},
  "description": {{ .Description }},
  "datePublished": "{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}",
  "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}",
  {{- with index site.Data.authors $author }}
  "author": {
    "@type": "Person",
    "name": {{ $author }},
    "jobTitle": {{ .role }},
    "image": "{{ .photo | absURL }}",
    "url": "{{ printf "%s#author" $.Permalink }}",
    "worksFor": { "@id": "{{ "/#org" | absURL }}" },
    "sameAs": [{{ range $i, $v := .links }}{{ if $i }}, {{ end }}{{ $v }}{{ end }}]
  },
  {{- else }}
  "author": { "@id": "{{ "/#org" | absURL }}" },
  {{- end }}
  "publisher": { "@id": "{{ "/#org" | absURL }}" },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ .Permalink }}"
  },
  "image": "{{ partial "seo/og-image.html" . | absURL }}",
  "articleSection": {{ $section }},
  "wordCount": {{ .WordCount }},
  "keywords": {{ delimit (.Params.keywords | default (slice .Params.primary_keyword)) ", " }}
}
</script>
