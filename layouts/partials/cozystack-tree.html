{{/*
  cozystack-tree.html — hero visual for the Cozystack product page.
  A composition tree: what ships inside Cozystack, on what it runs.
  Distinct from the homepage layer diagram on purpose — this one
  explains the contents, not the commercial stack.
*/}}
<svg class="hero-diagram cozystack-tree" viewBox="0 0 440 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cozystack composition: virtual machines, managed Kubernetes, databases, networking, storage, and observability — running on bare metal, powered by Kubernetes">
  <defs>
    <linearGradient id="ct-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="ct-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="ct-dot-glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- root: Cozystack -->
  <rect class="hd-plat-halo" x="24" y="20" width="392" height="58" rx="13" fill="rgba(1,165,255,0.35)" filter="url(#ct-glow)"/>
  <rect x="24" y="20" width="392" height="58" rx="13" fill="rgba(1,165,255,0.10)" stroke="rgba(1,165,255,0.5)" stroke-width="1.5"/>
  <rect x="25" y="21" width="390" height="56" rx="12" fill="url(#ct-glass)"/>
  <text x="220" y="46" text-anchor="middle" fill="#F1F5F9" font-size="19" font-weight="800">Cozystack</text>
  <text x="220" y="65" text-anchor="middle" fill="#94A3B8" font-size="11">open-source cloud platform · Apache 2.0</text>

  <!-- trunk + branches -->
  <g class="hd-wires hd-z2" stroke="rgba(1,165,255,0.45)" stroke-width="1.5">
    <path d="M60 78v218"/>
    <path d="M60 110h28"/><path d="M60 146h28"/><path d="M60 182h28"/>
    <path d="M60 218h28"/><path d="M60 254h28"/><path d="M60 290h28"/>
  </g>
  <g class="hd-dots hd-z2" fill="#01A5FF" filter="url(#ct-dot-glow)">
    <circle cx="60" cy="110" r="2.5"/><circle cx="60" cy="146" r="2.5"/><circle cx="60" cy="182" r="2.5"/>
    <circle cx="60" cy="218" r="2.5"/><circle cx="60" cy="254" r="2.5"/><circle cx="60" cy="290" r="2.5"/>
  </g>

  <!-- leaves -->
  <g class="ct-leaves">
    <g><rect x="88" y="94" width="240" height="32" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)"/><rect x="89" y="95" width="238" height="30" rx="7" fill="url(#ct-glass)"/><text x="104" y="114" fill="#F1F5F9" font-size="13" font-weight="600">Virtual machines</text><text x="316" y="114" text-anchor="end" fill="#64748B" font-size="10.5">KubeVirt</text></g>
    <g><rect x="88" y="130" width="240" height="32" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)"/><rect x="89" y="131" width="238" height="30" rx="7" fill="url(#ct-glass)"/><text x="104" y="150" fill="#F1F5F9" font-size="13" font-weight="600">Managed Kubernetes</text><text x="316" y="150" text-anchor="end" fill="#64748B" font-size="10.5">per tenant</text></g>
    <g><rect x="88" y="166" width="240" height="32" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)"/><rect x="89" y="167" width="238" height="30" rx="7" fill="url(#ct-glass)"/><text x="104" y="186" fill="#F1F5F9" font-size="13" font-weight="600">Databases</text><text x="316" y="186" text-anchor="end" fill="#64748B" font-size="10.5">PostgreSQL · Redis · Kafka</text></g>
    <g><rect x="88" y="202" width="240" height="32" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)"/><rect x="89" y="203" width="238" height="30" rx="7" fill="url(#ct-glass)"/><text x="104" y="222" fill="#F1F5F9" font-size="13" font-weight="600">Networking</text><text x="316" y="222" text-anchor="end" fill="#64748B" font-size="10.5">Cilium · eBPF</text></g>
    <g><rect x="88" y="238" width="240" height="32" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)"/><rect x="89" y="239" width="238" height="30" rx="7" fill="url(#ct-glass)"/><text x="104" y="258" fill="#F1F5F9" font-size="13" font-weight="600">Storage</text><text x="316" y="258" text-anchor="end" fill="#64748B" font-size="10.5">LINSTOR · Ceph</text></g>
    <g><rect x="88" y="274" width="240" height="32" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)"/><rect x="89" y="275" width="238" height="30" rx="7" fill="url(#ct-glass)"/><text x="104" y="294" fill="#F1F5F9" font-size="13" font-weight="600">Observability</text><text x="316" y="294" text-anchor="end" fill="#64748B" font-size="10.5">VictoriaMetrics</text></g>
  </g>

  <!-- footing -->
  <g class="hd-wires hd-z3" stroke="rgba(167,139,250,0.45)" stroke-width="1.5">
    <path d="M220 306v14"/>
  </g>
  <rect x="24" y="320" width="188" height="34" rx="9" fill="rgba(139,92,246,0.08)" stroke="rgba(167,139,250,0.3)"/>
  <text x="118" y="341" text-anchor="middle" fill="#C4B5FD" font-size="12" font-weight="600">Runs on bare metal</text>
  <rect x="228" y="320" width="188" height="34" rx="9" fill="rgba(139,92,246,0.08)" stroke="rgba(167,139,250,0.3)"/>
  <text x="322" y="341" text-anchor="middle" fill="#C4B5FD" font-size="12" font-weight="600">Powered by Kubernetes</text>
</svg>
