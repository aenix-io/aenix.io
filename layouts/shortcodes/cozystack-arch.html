{{/*
  cozystack-arch — the big explanatory architecture figure for the
  Cozystack product page: request flow from tenant down to bare metal.
*/}}
<figure class="cozystack-arch">
<svg viewBox="0 0 560 470" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cozystack architecture, top to bottom: tenant or developer, Cozystack API and dashboard, managed services and Kubernetes, KubeVirt with Cilium or Kube-OVN networking and LINSTOR, Ceph, or ZFS storage, Talos Linux, bare-metal infrastructure">
  <defs>
    <linearGradient id="ca-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="ca-dot-glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Tenant / Developer -->
  <rect x="150" y="16" width="260" height="46" rx="23" fill="rgba(139,92,246,0.10)" stroke="rgba(167,139,250,0.4)"/>
  <text x="280" y="44" text-anchor="middle" fill="#F1F5F9" font-size="14" font-weight="700">Tenant / Developer</text>

  <g class="hd-wires" stroke="rgba(1,165,255,0.5)" stroke-width="1.5">
    <path d="M280 62v22"/><path d="M280 148v22"/><path d="M280 234v22"/>
    <path d="M280 320v22"/><path d="M280 390v16"/>
  </g>
  <g fill="#01A5FF" filter="url(#ca-dot-glow)">
    <circle cx="280" cy="73" r="2.5"/><circle cx="280" cy="159" r="2.5"/><circle cx="280" cy="245" r="2.5"/>
    <circle cx="280" cy="331" r="2.5"/><circle cx="280" cy="398" r="2.5"/>
  </g>

  <!-- API & Dashboard -->
  <rect x="60" y="84" width="440" height="64" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)"/>
  <rect x="61" y="85" width="438" height="62" rx="11" fill="url(#ca-glass)"/>
  <text x="280" y="112" text-anchor="middle" fill="#F1F5F9" font-size="15" font-weight="700">Cozystack API &amp; Dashboard</text>
  <text x="280" y="132" text-anchor="middle" fill="#94A3B8" font-size="11.5">self-service portal · Kubernetes-native API · tenant isolation</text>

  <!-- Managed services & K8s -->
  <rect x="60" y="170" width="440" height="64" rx="12" fill="rgba(1,165,255,0.07)" stroke="rgba(1,165,255,0.4)"/>
  <rect x="61" y="171" width="438" height="62" rx="11" fill="url(#ca-glass)"/>
  <text x="280" y="198" text-anchor="middle" fill="#F1F5F9" font-size="15" font-weight="700">Managed Services &amp; Kubernetes</text>
  <text x="280" y="218" text-anchor="middle" fill="#94A3B8" font-size="11.5">databases · S3 · tenant Kubernetes clusters · GPU workloads</text>

  <!-- Virtualization / networking / storage -->
  <rect x="60" y="256" width="440" height="64" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)"/>
  <rect x="61" y="257" width="438" height="62" rx="11" fill="url(#ca-glass)"/>
  <text x="280" y="284" text-anchor="middle" fill="#F1F5F9" font-size="14" font-weight="700">KubeVirt · Cilium / Kube-OVN · LINSTOR / Ceph / ZFS</text>
  <text x="280" y="304" text-anchor="middle" fill="#94A3B8" font-size="11.5">virtualization · eBPF networking · replicated storage</text>

  <!-- Talos -->
  <rect x="60" y="342" width="440" height="48" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)"/>
  <rect x="61" y="343" width="438" height="46" rx="11" fill="url(#ca-glass)"/>
  <text x="280" y="371" text-anchor="middle" fill="#F1F5F9" font-size="14" font-weight="700">Talos Linux</text>

  <!-- Bare metal -->
  <rect x="60" y="406" width="440" height="48" rx="12" fill="rgba(139,92,246,0.08)" stroke="rgba(167,139,250,0.35)"/>
  <text x="280" y="435" text-anchor="middle" fill="#C4B5FD" font-size="14" font-weight="700">Bare-metal infrastructure</text>
</svg>
</figure>
