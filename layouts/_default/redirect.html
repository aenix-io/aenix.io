{{- $target := .Params.target -}}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer-when-downgrade">
<meta http-equiv="refresh" content="0; url={{ $target }}">
<link rel="canonical" href="{{ $target }}">
<title>Redirecting…</title>
<script>location.replace({{ $target }});</script>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0B0F1A;color:#94A3B8;
       font:15px/1.6 Inter,system-ui,-apple-system,sans-serif;padding:20px;text-align:center}
  a{color:#01A5FF;word-break:break-all}
</style>
</head>
<body>
<p>Redirecting to <a href="{{ $target }}">{{ $target }}</a>…<br>
<small>If nothing happens, use the link above.</small></p>
</body>
</html>
