{{ define "head" }}
  <meta name="robots" content="noindex,nofollow">
{{ end }}

{{ define "main" }}
<section class="lr-wrap">
  <div class="lr-container">
    <div class="lr-head">
      <div>
        <h1 class="lr-title">Link registry</h1>
        <p class="lr-sub">Every shortened and UTM-tagged link created with the <a href="/go/">link tools</a>, newest first.</p>
      </div>
      <a href="/go/" class="lr-btn lr-btn-ghost">← Back to tools</a>
    </div>

    <div id="lr-stats" class="lr-stats"></div>

    <div class="lr-toolbar">
      <input id="lr-search" type="search" placeholder="Filter by URL, slug, source, medium, campaign…" autocomplete="off">
      <div class="lr-tabs">
        <button class="lr-tab is-active" data-f="all" type="button">All</button>
        <button class="lr-tab" data-f="short" type="button">Short links</button>
        <button class="lr-tab" data-f="utm" type="button">UTM only</button>
        <button id="lr-arch" class="lr-tab" type="button">Show archived</button>
      </div>
    </div>

    <div id="lr-state" class="lr-state">Loading…</div>

    <div class="lr-tablewrap" hidden>
      <table class="lr-table">
        <thead>
          <tr>
            <th>Type</th><th>Link / target</th><th>Source</th><th>Medium</th>
            <th>Campaign</th><th>By</th><th class="lr-num">Clicks</th><th>Created</th><th></th>
          </tr>
        </thead>
        <tbody id="lr-body"></tbody>
      </table>
    </div>
  </div>
</section>

<style>
  .lr-wrap{padding:5rem 20px;background:var(--bg-main,#0B0F1A);min-height:70vh}
  .lr-container{max-width:1120px;margin:0 auto;font-family:var(--font-body,'Inter',system-ui,sans-serif)}
  .lr-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-bottom:24px}
  .lr-title{font-size:2rem;margin:0 0 6px;color:var(--text-primary,#F1F5F9);font-weight:700}
  .lr-sub{color:var(--text-secondary,#94A3B8);margin:0;font-size:.95rem}
  .lr-sub a{color:var(--brand-primary,#01A5FF);text-decoration:none}
  .lr-btn{background:var(--brand-primary,#01A5FF);color:#001018;border:none;border-radius:11px;padding:10px 18px;font-size:.9rem;font-weight:700;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-block}
  .lr-btn-ghost{background:transparent;color:var(--brand-primary,#01A5FF);border:1px solid var(--border-hover,rgba(255,255,255,.15))}
  .lr-stats{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:22px}
  .lr-stat{background:var(--glass-bg,rgba(255,255,255,.04));border:1px solid var(--glass-border,rgba(255,255,255,.08));border-radius:14px;padding:14px 20px;min-width:120px}
  .lr-stat b{display:block;font-size:1.6rem;color:var(--text-primary,#F1F5F9);font-weight:700;line-height:1.1}
  .lr-stat span{font-size:.78rem;color:var(--text-secondary,#94A3B8);text-transform:uppercase;letter-spacing:.04em}
  .lr-toolbar{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
  #lr-search{flex:1;min-width:240px;padding:11px 14px;border:1px solid var(--border-default,rgba(255,255,255,.1));border-radius:11px;background:rgba(255,255,255,.03);color:var(--text-primary,#F1F5F9);font-size:.92rem;font-family:inherit}
  #lr-search:focus{outline:none;border-color:var(--brand-primary,#01A5FF);box-shadow:0 0 0 3px rgba(1,165,255,.2)}
  .lr-tabs{display:flex;gap:6px}
  .lr-tab{background:transparent;border:1px solid var(--border-default,rgba(255,255,255,.1));color:var(--text-secondary,#94A3B8);border-radius:9px;padding:9px 14px;font-size:.85rem;font-weight:600;cursor:pointer;font-family:inherit}
  .lr-tab.is-active{background:rgba(1,165,255,.14);border-color:var(--brand-primary,#01A5FF);color:var(--brand-primary,#01A5FF)}
  .lr-state{color:var(--text-secondary,#94A3B8);padding:30px 0;font-size:.95rem}
  .lr-tablewrap{overflow-x:auto;border:1px solid var(--glass-border,rgba(255,255,255,.08));border-radius:14px;background:var(--glass-bg,rgba(255,255,255,.04))}
  .lr-table{width:100%;border-collapse:collapse;font-size:.86rem}
  .lr-table th{text-align:left;padding:12px 14px;color:var(--text-secondary,#94A3B8);font-weight:600;font-size:.76rem;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border-default,rgba(255,255,255,.1));white-space:nowrap}
  .lr-table td{padding:12px 14px;border-bottom:1px solid var(--border-subtle,rgba(255,255,255,.06));color:var(--text-primary,#F1F5F9);vertical-align:top}
  .lr-table tr:last-child td{border-bottom:none}
  .lr-num{text-align:right}
  .lr-table td.lr-num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:var(--brand-cyan,#94DEE0)}
  .lr-badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:.72rem;font-weight:700}
  .lr-badge.short{background:rgba(1,165,255,.14);color:var(--brand-primary,#01A5FF)}
  .lr-badge.utm{background:rgba(212,246,178,.12);color:var(--brand-green,#D4F6B2)}
  .lr-link{color:var(--brand-primary,#01A5FF);text-decoration:none;font-family:var(--font-mono,monospace);font-size:.82rem}
  .lr-link:hover{text-decoration:underline}
  .lr-target{display:block;color:var(--text-secondary,#94A3B8);font-size:.78rem;word-break:break-all;margin-top:3px;max-width:420px}
  .lr-copy{background:none;border:none;color:var(--text-secondary,#94A3B8);cursor:pointer;font-size:.8rem;padding:0 0 0 6px}
  .lr-copy:hover{color:var(--brand-primary,#01A5FF)}
  .lr-muted{color:rgba(148,163,184,.5)}
  .lr-off{opacity:.45}
  .lr-act{background:transparent;border:1px solid var(--border-default,rgba(255,255,255,.1));color:var(--text-secondary,#94A3B8);border-radius:8px;padding:5px 11px;font-size:.78rem;font-weight:600;cursor:pointer;font-family:inherit}
  .lr-act:hover{border-color:var(--brand-primary,#01A5FF);color:var(--brand-primary,#01A5FF)}
  .lr-date{white-space:nowrap;color:var(--text-secondary,#94A3B8);font-size:.8rem}
</style>
{{ end }}

{{ define "scripts" }}
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var ALL = [], filter='all', q='', showArchived=false;

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function fmtDate(iso){ if(!iso) return '—'; try{ return new Date(iso).toISOString().slice(0,16).replace('T',' '); }catch(e){ return iso; } }

  function render(){
    var body=$('lr-body'); var rows=ALL.filter(function(r){
      if(!showArchived && r.disabled) return false;
      if(filter!=='all' && r.type!==filter) return false;
      if(!q) return true;
      var hay=[r.slug,r.short,r.url,(r.utm&&r.utm.source),(r.utm&&r.utm.medium),(r.utm&&r.utm.campaign)].join(' ').toLowerCase();
      return hay.indexOf(q)!==-1;
    });
    if(!rows.length){ $('lr-state').textContent = ALL.length ? 'No links match the filter.' : 'No links yet — create one in the tools.'; $('lr-state').hidden=false; $('.lr-tablewrap'); document.querySelector('.lr-tablewrap').hidden=true; return; }
    $('lr-state').hidden=true; document.querySelector('.lr-tablewrap').hidden=false;
    body.innerHTML = rows.map(function(r){
      var u=r.utm||{};
      var linkCell = r.type==='short'
        ? '<a class="lr-link" href="'+esc(r.short)+'" target="_blank" rel="noopener">'+esc(r.short)+'</a><button class="lr-copy" data-c="'+esc(r.short)+'" title="Copy">⧉</button><span class="lr-target">'+esc(r.url)+'</span>'
        : '<a class="lr-link" href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc((r.url||'').slice(0,60))+((r.url||'').length>60?'…':'')+'</a><button class="lr-copy" data-c="'+esc(r.url)+'" title="Copy">⧉</button>';
      return '<tr>'
        +'<td><span class="lr-badge '+esc(r.type)+'">'+(r.type==='short'?'short':'utm')+'</span></td>'
        +'<td>'+linkCell+'</td>'
        +'<td>'+(u.source?esc(u.source):'<span class="lr-muted">—</span>')+'</td>'
        +'<td>'+(u.medium?esc(u.medium):'<span class="lr-muted">—</span>')+'</td>'
        +'<td>'+(u.campaign?esc(u.campaign):'<span class="lr-muted">—</span>')+'</td>'
        +'<td>'+(r.created_by?('@'+esc(r.created_by)):'<span class="lr-muted">—</span>')+'</td>'
        +'<td class="lr-num">'+(r.type==='short'?(r.clicks||0):'<span class="lr-muted">—</span>')+'</td>'
        +'<td class="lr-date">'+fmtDate(r.created)+'</td>'
        +'<td><button class="lr-act" data-kind="'+esc(r.type)+'" data-key="'+esc(r.type==='short'?r.slug:r.key)+'" data-on="'+(r.disabled?'1':'0')+'">'+(r.disabled?'Restore':'Archive')+'</button></td>'
        +'</tr>';
    }).join('');
    Array.prototype.forEach.call(body.querySelectorAll('tr'), function(tr,i){ if(rows[i] && rows[i].disabled) tr.classList.add('lr-off'); });
    Array.prototype.forEach.call(body.querySelectorAll('.lr-copy'), function(b){
      b.addEventListener('click', function(){ navigator.clipboard.writeText(b.getAttribute('data-c')); var o=b.textContent; b.textContent='✓'; setTimeout(function(){b.textContent=o;},1000); });
    });
    Array.prototype.forEach.call(body.querySelectorAll('.lr-act'), function(b){
      b.addEventListener('click', function(){
        b.disabled=true; b.textContent='…';
        fetch('/.netlify/functions/delete-link',{method:'POST',headers:{'content-type':'application/json'},
          body:JSON.stringify({kind:b.getAttribute('data-kind'),key:b.getAttribute('data-key'),restore:b.getAttribute('data-on')==='1'})})
          .then(function(r){return r.json();})
          .then(function(res){ if(res.ok){ var m=ALL.filter(function(x){ return (x.slug||x.key)===b.getAttribute('data-key'); })[0]; if(m) m.disabled=res.disabled; render(); } else { b.disabled=false; b.textContent='Retry'; } })
          .catch(function(){ b.disabled=false; b.textContent='Retry'; });
      });
    });
  }

  function stats(d){
    $('lr-stats').innerHTML =
      '<div class="lr-stat"><b>'+(d.count||0)+'</b><span>links</span></div>'+
      '<div class="lr-stat"><b>'+(d.shortCount||0)+'</b><span>short</span></div>'+
      '<div class="lr-stat"><b>'+(d.utmCount||0)+'</b><span>utm only</span></div>'+
      '<div class="lr-stat"><b>'+(d.totalClicks||0)+'</b><span>clicks</span></div>';
  }

  $('lr-search').addEventListener('input', function(){ q=this.value.trim().toLowerCase(); render(); });
  Array.prototype.forEach.call(document.querySelectorAll('.lr-tab[data-f]'), function(t){
    t.addEventListener('click', function(){
      Array.prototype.forEach.call(document.querySelectorAll('.lr-tab[data-f]'), function(x){ x.classList.remove('is-active'); });
      t.classList.add('is-active'); filter=t.getAttribute('data-f'); render();
    });
  });
  $('lr-arch').addEventListener('click', function(){ showArchived=!showArchived; this.classList.toggle('is-active',showArchived); this.textContent=showArchived?'Hide archived':'Show archived'; render(); });

  fetch('/.netlify/functions/links-list')
    .then(function(r){ return r.json(); })
    .then(function(d){ if(d.error){ $('lr-state').textContent='Could not load the registry: '+d.error; return; } ALL=d.links||[]; stats(d); render(); })
    .catch(function(){ $('lr-state').textContent='Network error loading the registry.'; });
})();
</script>
{{ end }}
