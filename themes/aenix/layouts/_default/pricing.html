{{ define "head" }}
<link rel="stylesheet" href="/css/pricing-table.css">
{{ end }}

{{ define "main" }}
<section class="page-hero">
  <div class="page-hero-bg">
    <div class="page-hero-grid"></div>
    <div class="page-hero-glow"></div>
  </div>
  <div class="container">
    <h1 class="page-hero-title">{{ .Title }}</h1>
    {{ with .Params.hero_subtitle }}<p class="page-hero-subtitle">{{ . }}</p>{{ end }}
  </div>
</section>

<div class="container">
  <div class="page-content" style="max-width:100%">
    {{/* The page body owns the narrative and decides where the tier table sits
         — it is emitted by the {{< pricing-table >}} shortcode. */}}
    {{ .Content }}

    <div style="text-align:center;margin:2rem 0">
      <a href="/contact/" class="btn btn-primary btn-lg">CONTACT US</a>
    </div>
  </div>
</div>

<script defer src="/js/pricing-table.js"></script>
{{ end }}
