[build]
  publish = "public"
  command = "hugo --gc --minify"

[build.environment]
  HUGO_VERSION = "0.151.1"
  HUGO_EXTENDED = "true"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

# Short-link resolver: /l/<slug> → go function (first-party click counter + 302
# redirect to the target). Must come BEFORE the catch-all 404 below.
[[redirects]]
  from = "/l/*"
  to = "/.netlify/functions/go?s=:splat"
  status = 200

# Keep the /l/ and registry pages out of GA4/search as extra safety.
[[headers]]
  for = "/l/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
