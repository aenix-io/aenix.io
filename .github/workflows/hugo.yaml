# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.151.1
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      - name: Build with Hugo
        env:
          # For maximum backward compatibility with Hugo modules
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Patch robots.txt
        # if built in a contributor's repo and deployed to personal pages, disallow search indexing
        if: github.repository_owner != 'aenix-io'
        run: |
          echo -e "\nDisallow: /" >> public/robots.txt
          cat public/robots.txt
      - name: Verify certification pages
        # Страница проверки сертификата обязана быть самодостаточной: в её адресе
        # лежит имя держателя, и оно не должно уезжать в аналитику. Плюс Hugo молча
        # подставляет обычный шаблон при опечатке в layout — ловим и это.
        run: |
          f=public/certification/verify/index.html
          test -f "$f"
          ! grep -Eq '(src|href)="(https?:)?//' "$f"
          ! grep -Eq 'consent\.js|fonts\.(googleapis|gstatic)|AENIX_GA_ID|AENIX_APOLLO_ID|AENIX_AHREFS' "$f"
          grep -q 'Content-Security-Policy' "$f"
          for p in "" rules practice exam verify; do
            test -f "public/certification/$p/index.html"
          done
          test -f public/workshop/labs/index.html
          for t in cert-page cert-practice cert-verify; do
            grep -rq "data-tpl=\"$t\"" public/certification public/workshop
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
