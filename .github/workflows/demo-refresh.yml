# Rebuilds the embedded Ænix Platform demo (static/demo-app) from
# aenix-org/cozyportal-demo and opens a PR when it changes. Self-contained:
# demo-src/build.sh clones the demo, builds it, bakes the /kc service worker,
# and vendors the bundle; the PR is opened in THIS repo with the built-in
# GITHUB_TOKEN — no fork, no external token.
#
# Requires: Settings → Actions → General → "Allow GitHub Actions to create and
# approve pull requests" (enabled once).

name: Refresh platform demo

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC

concurrency:
  group: demo-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild static/demo-app from cozyportal-demo
        env:
          # cozyportal-demo is private and lives in aenix-org, which the
          # workflow's built-in GITHUB_TOKEN cannot read. Needs a token with
          # read access to that repo, stored as DEMO_SRC_TOKEN.
          DEMO_SRC_TOKEN: ${{ secrets.DEMO_SRC_TOKEN }}
        run: bash demo-src/build.sh master

      - name: Open a PR if the demo changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- static/demo-app; then
            echo "No demo changes — nothing to do."
            exit 0
          fi
          BR="demo/refresh-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add static/demo-app
          git commit --signoff -m "chore(demo): refresh Ænix Platform demo from cozyportal-demo"
          git push origin "$BR"
          gh pr create --base main --head "$BR" --draft \
            --title "chore(demo): refresh Ænix Platform demo" \
            --body "Automated rebuild of static/demo-app from cozyportal-demo (base /demo-app/, /kc service worker regenerated). Review the deploy preview, then merge. Not auto-merged."
