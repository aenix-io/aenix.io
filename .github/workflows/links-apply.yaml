name: Apply link changesets

# A merged changeset is applied here: data/links/_inbox/*.json is folded into
# one data/links/<slug>.json per link and then deleted. Splitting this from the
# pull request keeps the submitted shape (one file, one click) independent of
# the stored shape (one file per link, individually editable).

on:
  push:
    branches: [main]
    paths: ['data/links/_inbox/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A PAT, not GITHUB_TOKEN: a push made with GITHUB_TOKEN starts no
          # further workflow, so the Pages deploy would never run and the applied
          # links would sit in the repository unpublished.
          token: ${{ secrets.LINKS_SYNC_TOKEN }}

      - name: Apply
        run: |
          set -o pipefail
          node scripts/apply-links.mjs 2>&1 | tee apply.log

      - name: Report
        if: always()
        run: |
          {
            echo '## Applied link changesets'
            echo
            echo '```'
            cat apply.log 2>/dev/null || echo 'no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit
        run: |
          git add -A data/links
          if git diff --cached --quiet; then
            echo 'Nothing to apply.'
            exit 0
          fi
          git config user.name 'aenix-bot'
          git config user.email 'info@aenix.io'
          git commit --signoff --message 'chore(links): apply changesets from the link editor'
          git push
