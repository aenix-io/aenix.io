baseURL: https://aenix.io/
languageCode: en-us
title: "Ænix — Turnkey cloud platform on Cozystack (CNCF)"
theme: aenix
enableRobotsTXT: true
canonicalizeURLs: false

# When a page last changed: an explicit `lastmod:` wins, otherwise the date of
# the last commit that touched the file, otherwise the publication date. Feeds
# BlogPosting dateModified, article:modified_time and <lastmod> in the sitemap,
# which otherwise always repeated the publication date. CI checks out the full
# history (fetch-depth: 0) for this.
enableGitInfo: true
frontmatter:
  lastmod: ["lastmod", ":git", "date"]

# Sitewide page_type assignment (GEO). Cascades into every landing page by
# section so authors don't repeat it. Page-level `page_type` in frontmatter
# overrides the cascade. EN + DE slugs both covered; non-matching globs are
# harmless. /for/ and /fuer/ are flag-page (no GEO requirement).
cascade:
  - _target: { path: '/{,de/}{solutions,loesungen}/**' }
    page_type: solution-landing
  - _target: { path: '/{,de/}{services,dienstleistungen}/**' }
    page_type: services-landing
  - _target: { path: '/{,de/}{industries,branchen}/**' }
    page_type: industry-landing
  - _target: { path: '/{,de/}{alternatives,alternativen}/**' }
    page_type: alternative
  - _target: { path: '/{,de/}{compare,vergleichen}/**' }
    page_type: compare
  - _target: { path: '/{,de/}migration/**' }
    page_type: migration-hub
  - _target: { path: '/{,de/}{resources,ressourcen}/**' }
    page_type: lead-magnet
  - _target: { path: '/{,de/}{products,produkte}/**' }
    page_type: product
  - _target: { path: '/{,de/}{for,fuer}/**' }
    page_type: flag-page
  - _target: { path: '/{,de/}blog/**' }
    page_type: blog-article
  - _target: { path: '/{,ru/}workshops/**' }
    page_type: event-landing
  # TCO calculator pages are synced from aenix-org/calculators and embed their
  # own BreadcrumbList JSON-LD; without this they ship two conflicting trails.
  - _target: { path: '/tco-calculator{,/**}' }
    skip_breadcrumb_jsonld: true
  # /styleguide/ is a developer page with sample data (placeholder badges and a
  # sample testimonial). It renders under `hugo server` (development) only and
  # is not built at all in production.
  - _target: { path: '/styleguide{,/**}', environment: production }
    build: { render: never, list: never }

